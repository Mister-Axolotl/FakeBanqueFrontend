<h2 mat-dialog-title>Ouvrir un nouveau compte</h2>

<mat-dialog-content>
    <form [formGroup]="form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 0.5rem;">

        <mat-form-field appearance="outline">
            <mat-label>IBAN</mat-label>
            <input matInput formControlName="iban" placeholder="FR123456789" [readonly]="isLoading()" />
            @if (form.controls.iban.invalid && form.controls.iban.touched) {
            <mat-error>L'IBAN est requis</mat-error>
            }
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Solde initial (€)</mat-label>
            <input matInput type="number" formControlName="balance" [readonly]="isLoading()" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Découvert autorisé (€)</mat-label>
            <input matInput type="number" formControlName="overdraft" max="0" [readonly]="isLoading()" />
            <mat-hint>Doit être un montant négatif (ex: -50)</mat-hint>
        </mat-form-field>

        @if (errorMessage()) {
        <div style="color: #d32f2f; margin-top: 1rem;">
            {{ errorMessage() }}
        </div>
        }
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close [disabled]="isLoading()">Annuler</button>
    <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid || isLoading()">
        {{ isLoading() ? 'Création...' : 'Créer le compte' }}
    </button>
</mat-dialog-actions>
