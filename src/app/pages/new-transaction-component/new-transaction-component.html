<h2 mat-dialog-title>Nouvelle opération</h2>

<mat-dialog-content>
    <div class="operation-type-selector" role="group" aria-label="Choix du type d'opération">
        <button mat-stroked-button type="button" [class.selected]="operationType.value === 'DEPOSIT'"
            (click)="operationType.setValue('DEPOSIT')">
            Dépôt
        </button>
        <button mat-stroked-button type="button" [class.selected]="operationType.value === 'WITHDRAWAL'"
            (click)="operationType.setValue('WITHDRAWAL')">
            Retrait
        </button>
    </div>

    <mat-form-field appearance="outline" style="width: 100%; margin-top: 1rem;">
        <mat-label>Montant</mat-label>
        <input matInput type="number" min="1" [formControl]="amount" />
        @if (amount.invalid && amount.touched) {
        <mat-error>Entrez un montant valide</mat-error>
        }
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Annuler</button>
    <button mat-flat-button color="primary" (click)="submitOperation()" [disabled]="amount.invalid">
        Valider
    </button>
</mat-dialog-actions>
